<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EA; --paper:#F7F8F4; --ink:#1B2A22; --ink2:#4A5A50; --mute:#7E8B82; --line:#D8DDD3;
  --pine:#2F6B4F; --bruc:#9C5F8C; --ginesta:#E2B400; --terra:#9A5B2E; --alert:#B8412E; --ok:#2F6B4F;
  --accent:var(--pine); --accent-soft:#2F6B4F1A;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ginesta);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:var(--sat) 0 calc(92px + var(--sab))}

.header{padding:18px 20px 4px;display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.55rem;letter-spacing:.5px;color:var(--ink)}
.brand::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:2px}
.hbtns{display:flex;gap:6px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;color:var(--ink2);font-weight:500;background:var(--paper)}
.chip b{color:var(--ink);font-weight:600}

.profiles{display:flex;gap:6px;padding:12px 20px 0}
.prof{flex:1;background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:10px 6px 9px;text-align:left;transition:border-color .15s,background .15s}
.prof .pn{font-size:.95rem;font-weight:600;color:var(--ink)}
.prof .ps{font-size:.74rem;color:var(--mute);margin-top:1px}
.prof.on{border-color:var(--accent);background:var(--paper);box-shadow:inset 4px 0 0 var(--accent)}
.goal{font-size:.82rem;color:var(--ink2);padding:8px 20px 0;line-height:1.4}

.days{display:flex;gap:6px;padding:14px 20px 2px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex-shrink:0;padding:8px 0;width:44px;text-align:center;border-radius:12px;background:transparent;font-size:.82rem;font-weight:600;color:var(--ink2);border:1.5px solid transparent}
.day.on{background:var(--ink);color:var(--paper)}
.day.ok{border-color:var(--ok);color:var(--ok)}
.day.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}

.wrap{padding:6px 20px}
.dh{margin:12px 0 16px}
.dt{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:2.1rem;line-height:1;letter-spacing:.2px;color:var(--ink)}
.ds{color:var(--ink2);font-size:.92rem;margin-top:6px;line-height:1.45}
.badge{display:inline-block;font-size:.78rem;font-weight:600;color:var(--accent);margin-bottom:8px}
.badge::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:7px;vertical-align:1px}
.badge.run{color:#245A8A}.badge.run::before{background:#245A8A}
.badge.rest{color:var(--mute)}.badge.rest::before{background:var(--mute)}
.badge.play{color:var(--terra)}.badge.play::before{background:var(--terra)}

.sect{font-size:.8rem;font-weight:600;color:var(--mute);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}

.card{background:var(--paper);border-radius:16px;margin-bottom:10px;overflow:hidden;border:1.5px solid var(--line);transition:border-color .15s}
.card.on{border-color:var(--accent)}
.card.ok{border-color:var(--ok);background:transparent}
.card.ok .cname{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:1.5px}
.ctop{display:flex;align-items:center;gap:13px;padding:12px 12px 12px 12px}
.art{width:92px;height:72px;border-radius:10px;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--accent)}
.art svg{width:100%;height:100%}
.art img{width:100%;height:100%;object-fit:cover}
.cinfo{flex:1;min-width:0}
.cname{font-weight:600;font-size:1rem;line-height:1.25;color:var(--ink)}
.cset{font-size:.9rem;color:var(--ink2);margin-top:3px}
.cset b,.cnote b{color:var(--ink)}
.cnote{font-size:.8rem;color:var(--mute);margin-top:3px;line-height:1.4}
.tick{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;color:var(--mute)}
.tick.ok{background:var(--ok);border-color:var(--ok);color:#fff}

.body{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.artbig{width:100%;height:190px;background:var(--bg);border-radius:12px;margin-bottom:12px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.artbig svg{width:100%;height:100%}
.artbig img{width:100%;height:100%;object-fit:contain}
.pA{animation:fa 2.8s infinite}.pB{animation:fb 2.8s infinite}
@keyframes fa{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes fb{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.pA,.pB{animation:none}.pA{opacity:.3}}
.cues{list-style:none;font-size:.92rem;line-height:1.5}
.cues li{padding-left:16px;position:relative;margin-bottom:6px;color:var(--ink)}
.cues li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.warn{background:#B8412E12;border-left:3px solid var(--alert);padding:10px 12px;font-size:.88rem;color:#7A2A1C;margin-top:10px;line-height:1.5;border-radius:0 10px 10px 0}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-size:.9rem;font-weight:600;color:var(--ink);transition:background .12s}
.btn:active{background:var(--bg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.wide{flex:1;text-align:center}

.timer{background:var(--bg);border-radius:12px;padding:14px;margin-top:12px;text-align:center}
.tnum{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:3.4rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tlab{font-size:.82rem;color:var(--mute);margin-bottom:4px}
.tbar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.tfill{height:100%;background:var(--accent);width:0%;transition:width .95s linear}
.tfill.rest{background:#245A8A}
.sets{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;color:var(--mute)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}

.run{background:var(--ginesta);color:#2A2200;border-radius:20px;padding:18px 18px 16px;margin-bottom:12px}
.run .btn{background:#2A2200;border-color:#2A2200;color:var(--ginesta)}
.run .btn.pri{background:#2A2200;border-color:#2A2200;color:var(--ginesta)}
.run .badge{color:#2A2200}.run .badge::before{background:#2A2200}
.run.kid{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.run.kid .btn{background:var(--paper);border-color:var(--line);color:var(--ink)}
.run.kid .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rk{font-size:.82rem;font-weight:600;opacity:.75}
.rt{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.7rem;line-height:1.05;margin-top:2px}
.rplan{display:flex;gap:8px;margin:14px 0 6px}
.rp{background:#00000012;border-radius:12px;padding:10px 12px;flex:1;min-width:0}
.rp .k{font-size:.74rem;font-weight:600;opacity:.7}
.rp .v{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.6rem;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.rstate{text-align:center;padding:16px 0 6px}
.rphase{font-size:.9rem;font-weight:600;opacity:.75}
.rbig{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:5.2rem;line-height:1;font-variant-numeric:tabular-nums;color:#2A2200}
.rbig.walk{color:#2A2200;opacity:.55}.rbig.run{color:#2A2200}
.rrounds{font-size:.9rem;margin-top:6px;opacity:.8}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.gc{aspect-ratio:1;border-radius:6px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--mute)}
.gc.f{background:var(--accent);border-color:var(--accent)}
.gc.r{background:#245A8A;border-color:#245A8A}
.gc.p{background:var(--terra);border-color:var(--terra)}
.stats{display:flex;gap:8px;margin:12px 0}
.st{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.st .v{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.st .k{font-size:.74rem;color:var(--mute);margin-top:4px}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1.5px solid var(--line);display:flex;padding:8px 0 calc(8px + var(--sab));z-index:20}
.nb{flex:1;text-align:center;font-size:.76rem;color:var(--mute);font-weight:600}
.nb .i{display:block;font-size:1.1rem;margin-bottom:2px;line-height:1}
.nb.on{color:var(--ink)}
.nb.on .i{color:var(--accent)}
.tip{background:var(--paper);border:1.5px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:11px 14px;font-size:.9rem;line-height:1.55;color:var(--ink);margin-bottom:10px}
.tip b{color:var(--ink);font-weight:600}
input.url,textarea.url{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:.9rem;margin-top:10px;font-family:inherit}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="brand">Define</div>
    <div class="hbtns">
      <button class="chip" onclick="cycleBlock()">Bloc <b id="blk">1</b></button>
      <button class="chip" onclick="toggleSound()"><span id="snd">So</span></button>
    </div>
  </div>
  <div class="profiles" id="profiles"></div>
  <div class="goal" id="goal"></div>
  <div id="days" class="days"></div>
  <div id="view" class="wrap"></div>
</div>
<div class="nav">
  <button class="nb on" id="nb-avui" onclick="go('avui')"><span class="i">●</span>Avui</button>
  <button class="nb" id="nb-familia" onclick="go('familia')"><span class="i">⁂</span>Família</button>
  <button class="nb" id="nb-setmana" onclick="go('setmana')"><span class="i">▤</span>Setmana</button>
  <button class="nb" id="nb-registre" onclick="go('registre')"><span class="i">✓</span>Registre</button>
  <button class="nb" id="nb-guia" onclick="go('guia')"><span class="i">?</span>Guia</button>
</div>
<script>
const F='var(--accent)', O='#9AA39B', J='#00000040';
function joints(d,w){
  let out='', re=/([ML])\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/g, m, pts=[];
  while((m=re.exec(d))) pts.push([m[2],m[3]]);
  pts.forEach(pt=>{ out+=`<circle cx='${pt[0]}' cy='${pt[1]}' r='${(w*0.42).toFixed(1)}' fill='${J}'/>`; });
  return out;
}
function pose(a,col,op){
  let s='';
  (a.o||[]).forEach(o=>{
    if(o[0]==='r') s+=`<rect x='${o[1]}' y='${o[2]}' width='${o[3]}' height='${o[4]}' rx='7' fill='${O}'/>`;
    if(o[0]==='e') s+=`<ellipse cx='${o[1]}' cy='${o[2]}' rx='${o[3]}' ry='${o[4]}' fill='${O}'/>`;
    if(o[0]==='l') s+=`<path d='${o[1]}' fill='none' stroke='${O}' stroke-width='${o[2]}' stroke-linecap='round'/>`;
  });
  (a.s||[]).forEach(pp=>{
    const w=pp[1]*1.3;
    s+=`<path d='${pp[0]}' fill='none' stroke='${col}' stroke-width='${w.toFixed(1)}' stroke-linecap='round' stroke-linejoin='round' opacity='${op}'/>`;
  });
  (a.s||[]).forEach(pp=>{ s+=`<g opacity='${op}'>`+joints(pp[0],pp[1]*1.3)+`</g>`; });
  if(a.h) s+=`<circle cx='${a.h[0]}' cy='${a.h[1]}' r='${a.h[2]+1.5}' fill='${col}' opacity='${op}'/>`;
  (a.d||[]).forEach(d=>{ s+=`<path d='${d}' fill='none' stroke='${O}' stroke-width='2.2' stroke-dasharray='6 5' stroke-linecap='round' opacity='${op}'/>`; });
  return s;
}
function art(a,big){
  let s="<svg viewBox='0 0 200 140' xmlns='http://www.w3.org/2000/svg'>";
  if(a.f!==false){ s+="<line x1='8' y1='126' x2='192' y2='126' stroke='#4a4a58' stroke-width='2.5' stroke-linecap='round'/>";
    s+="<ellipse cx='100' cy='131' rx='72' ry='3' fill='#00000055'/>"; }
  const g=a.g?Object.assign({},a,a.g):null;
  if(big&&g){
    s+=`<g class="pA">`+pose(g,F,1)+`<text x='100' y='16' text-anchor='middle' fill='#7E8B82' font-family='Instrument Sans' font-size='11' font-weight='600'>Inici</text></g>`;
    s+=`<g class="pB">`+pose(a,F,1)+`<text x='100' y='16' text-anchor='middle' fill='#7E8B82' font-family='Instrument Sans' font-size='11' font-weight='600'>Final</text></g>`;
  } else {
    if(g) s+=pose(g,'#C5CBC2',1);
    s+=pose(a,F,1);
  }
  return s+"</svg>";
}
const EX={
 flexinc:{n:"Flexions inclinades",yt:"incline push up form",
  a:{g:{o:[['r',138,88,50,37]],s:[['M 26 118 L 78 96 L 132 72',14],['M 132 74 L 145 88',9],['M 26 118 L 15 122',8]],h:[143,60,10]},o:[['r',138,88,50,37]],s:[['M 26 120 L 78 100 L 132 80',14],['M 132 82 L 146 94',9],['M 26 120 L 15 124',8]],h:[142,68,10]},
  c:["Mans a una roca o tronc a l'altura de la cintura.","Cos recte de talons a cap, glutis apretats.","Baixa en 2 segons, colzes a 45 graus del cos.","Com més baixa la roca, més difícil."]},
 pressp:{n:"Press d'espatlla amb pedra",yt:"overhead press stone form",
  a:{g:{o:[['e',100,66,20,9]],s:[['M 92 124 L 94 88',13],['M 108 124 L 106 88',13],['M 100 90 L 100 56',16],['M 100 60 L 86 74',9],['M 100 60 L 114 74',9]],h:[100,44,9]},o:[['e',100,22,20,9]],s:[['M 92 124 L 94 88',13],['M 108 124 L 106 88',13],['M 100 90 L 100 56',16],['M 100 58 L 86 34',9],['M 100 58 L 114 34',9]],h:[100,45,9]},
  c:["Pedra al pit amb les dues mans.","Empeny amunt fins a estirar els braços.","Abdomen apretat, no arquegis l'esquena.","Baixa controlat fins al pit."]},
 planfront:{n:"Planxa frontal",yt:"forearm plank correct form",
  a:{s:[['M 24 118 L 80 96 L 136 84',15],['M 136 86 L 138 116',9],['M 120 121 L 156 121',9]],h:[148,74,10]},
  c:["Recolzat als avantbraços, colzes sota les espatlles.","Línia recta de talons a cap.","Glutis i abdomen apretats, malucs ni amunt ni avall.","Respira normal, no aguantis l'aire."]},
 plateral:{n:"Planxa lateral",yt:"side plank proper form",
  a:{s:[['M 28 121 L 150 58',15],['M 96 92 L 72 121',9],['M 104 84 L 118 40',8]],h:[158,50,10]},
  c:["Recolzat en un colze i el cantell del peu.","Maluc ben amunt, cos en línia recta.","Fes els dos costats.","Versió fàcil: recolza els genolls."]},
 birddog:{n:"Bird-dog",yt:"bird dog exercise form",
  a:{s:[['M 70 92 L 130 92',15],['M 128 94 L 133 122',9],['M 72 94 L 66 122',11],['M 128 89 L 168 76',8],['M 70 89 L 30 77',10]],h:[150,84,9]},
  c:["A quatre grapes, mans sota espatlles i genolls sota malucs.","Estira alhora braç i cama CONTRARIS.","El maluc no ha de balancejar-se.","Aguanta 2 segons a dalt i canvia."]},
 sentparc:{n:"Sentadilla parcial",yt:"partial squat bodyweight form",
  a:{s:[['M 96 124 L 110 96',13],['M 110 96 L 100 70',14],['M 100 72 L 104 46',16],['M 104 50 L 134 58',8]],h:[104,34,10]},
  c:["Baixa només fins a mitja flexió, uns 60 graus.","Pes als talons, genolls seguint la punta del peu.","Pit alt, esquena recta.","Si el genoll fa mal, escurça el recorregut."]},
 stepup:{n:"Pujada a tronc",yt:"step up exercise proper form",
  a:{g:{o:[['r',122,100,58,25]],s:[['M 140 100 L 132 82',13],['M 132 82 L 118 76',14],['M 118 76 L 116 50',16],['M 106 124 L 114 88',12],['M 116 54 L 134 66',8]],h:[116,38,10]},o:[['r',122,100,58,25]],s:[['M 138 100 L 128 80',13],['M 128 80 L 108 70',14],['M 108 70 L 111 46',16],['M 96 124 L 105 84',12],['M 111 50 L 131 62',8]],h:[111,34,10]},
  c:["El tronc mai més alt que el teu genoll.","Puja empenyent amb la cama de dalt, no amb impuls.","Baixa MOLT controlat: aquí és on protegeixes el genoll.","Totes les repeticions d'una cama, després canvia."]},
 bridge:{n:"Pont de glutis a una cama",yt:"single leg glute bridge form",
  a:{g:{s:[['M 42 118 L 100 116',16],['M 100 116 L 124 114',13],['M 124 114 L 129 124',11],['M 98 119 L 152 112',11]],h:[32,116,10]},s:[['M 42 116 L 98 96',16],['M 98 96 L 124 108',13],['M 124 108 L 129 124',11],['M 98 93 L 152 82',11]],h:[32,114,10]},
  c:["De panxa amunt, un peu al terra i l'altra cama estirada.","Empeny amb el taló i puja el maluc.","Línia recta espatlla-maluc-genoll.","Si ho notes als isquiotibials, acosta el peu al cul."]},
 bridge2:{n:"Pont de glutis",yt:"glute bridge exercise form",
  a:{g:{s:[['M 42 118 L 100 116',16],['M 100 116 L 122 112',13],['M 122 112 L 129 124',11],['M 98 119 L 120 118',12]],h:[32,116,10]},s:[['M 42 116 L 98 96',16],['M 98 96 L 124 108',13],['M 124 108 L 129 124',11],['M 96 99 L 120 112',12]],h:[32,114,10]},
  c:["Peus a l'amplada del maluc, talons a prop del cul.","Puja desenrotllant la columna, una vèrtebra cada cop.","Costelles avall: no arquegis les lumbars.","Baixa igual de lent, apilant vèrtebres fins al terra."]},
 rdl:{n:"Pes mort romanès",yt:"romanian deadlift hip hinge form",
  a:{g:{o:[['e',104,102,14,7]],s:[['M 96 124 L 98 92',13],['M 98 92 L 100 58',16],['M 100 62 L 103 96',9]],h:[100,46,10]},o:[['e',146,108,14,7]],s:[['M 92 124 L 96 92',13],['M 96 92 L 140 74',16],['M 139 77 L 145 101',9]],h:[150,66,10]},
  c:["Genolls una mica doblegats i FIXOS: no és una sentadilla.","Envia el maluc enrere, com tancant un calaix amb el cul.","Esquena plana, la pedra baixa fregant les cames.","Para quan notis l'estirada darrere la cuixa."]},

}
function howHtml(){

function go(t){ S.tab=t; save(); stopRun(); render(); }
function setProf(p){ S.prof=p; openEx=null; stopRun(); save(); render(); }

function render(){
  document.documentElement.style.setProperty('--accent',P_().acc);
  document.getElementById('blk').textContent=S.block[S.prof];
  document.getElementById('snd').textContent=S.sound?'So':'Silenci';
  document.getElementById('profiles').innerHTML=Object.keys(P).map(k=>
    `<button class="prof ${k===S.prof?'on':''}" onclick="setProf('${k}')"><div class="pn">${P[k].name}</div><div class="ps">${P[k].sub}</div></button>`).join('');

  ['avui','familia','setmana','registre','guia'].forEach(t=>document.getElementById('nb-'+t).className='nb'+(S.tab===t?' on':''));

  if(S.tab==='avui'){ dv.classList.remove('hide');
    dv.innerHTML=P_().days.map((d,i)=>{const dn=doneOn(i); return `<button class="day ${i===day?'on':''} ${dn?'ok':''}" onclick="setDay(${i})">${DS[i]}</button>`;}).join('');

function doneOn(i){
  const now=new Date(); let cur=now.getDay(); cur=cur===0?6:cur-1;
  const off=cur-i; if(off<0||off>6) return false;
  const e=L()[dkey(off)]; return !!(e&&e.ok);
}

function card(x,i,en){
  const id=exId(i), ex=EX[id], done=(en.ex[i]||0), dl=isDeload()&&S.prof!=='nen', sets=dl?Math.max(2,(x.s||1)-1):(x.s||1), ok=done>=sets, on=openEx===i;
  const photo=S.photos[id], swapped=id!==x.e, ch=CHAIN[id]||{}, isHold=/seg|minut|passes|metres|travessa|tram|recorregut|ronda|salts|llan|tirs|objectes|pujada|animal|esglaons/.test(x.r);
  let h=`<div class="card ${on?'on':''} ${ok?'ok':''}">
    <div class="ctop" onclick="tog(${i})">
      <div class="art">${photo?`<img src="${photo}" onerror="this.style.display='none'">`:art(ex.a)}</div>
      <div class="cinfo"><div class="cname">${ex.n}${swapped?' <span style="color:var(--mute);font-size:.78rem;font-weight:500">variant</span>':''}</div><div class="cset">${sets} × ${x.r}${dl?' <span style="color:var(--mute);font-weight:400">(descàrrega)</span>':''}</div>${x.d?`<div class="cnote">${x.d} seg de descans${S.prof!=='nen'&&!isHold?' · tempo '+TEMPO[S.prof].split(' ·')[0]:''}</div>`:''}</div>
      <div class="tick ${ok?'ok':''}">${ok?'✓':''}</div>
    </div>`;
  if(on){
    h+=`<div class="body"><div class="artbig">${photo?`<img src="${photo}">`:art(ex.a,1)}</div>`;
    if(WHY[id]) h+=`<div class="tip" style="margin-bottom:10px;padding:8px 11px"><b>Per què</b> · ${WHY[id]}</div>`;
    h+=`<ul class="cues">${ex.c.map(c=>`<li>${c}</li>`).join('')}</ul>`;
    if(S.prof!=='nen'&&!isHold) h+=`<div class="cnote" style="margin-top:9px"><b>Tempo</b> · ${TEMPO[S.prof]}. ${S.prof==='ell'?'Deixa sempre 2 repeticions al dipòsit: l\'última que fas no ha de ser l\'última que podries.':'Si perds el control del ritme, la sèrie s\'ha acabat.'}</div>`;
    if(ch.e||ch.h||swapped) h+=`<div class="acts" style="margin-top:10px">${ch.e?`<button class="btn" onclick="swapEx(${i},'${ch.e}')">← Més fàcil: ${EX[ch.e].n}</button>`:''}${ch.h?`<button class="btn" onclick="swapEx(${i},'${ch.h}')">Més difícil: ${EX[ch.h].n} →</button>`:''}${swapped?`<button class="btn" onclick="swapEx(${i},null)">Original</button>`:''}</div>`;
    h+=`<div class="sets">${Array.from({length:sets},(_,s)=>`<div class="dot ${s<done?'ok':''}">${s+1}</div>`).join('')}</div>`;
    if(rest&&rest.i===i) h+=`<div class="timer"><div class="tlab">Descans</div><div class="tnum" id="rn">${mmss(rest.left)}</div><div class="tbar"><div class="tfill rest" id="rb" style="width:${100-rest.left/rest.tot*100}%"></div></div><button class="btn wide" style="margin-top:10px" onclick="skipRest()">Saltar descans</button></div>`;
    h+=`<div class="acts">
      <button class="btn pri" onclick="setDone(${i},${sets},${x.d||30})">Sèrie feta</button>
      <button class="btn" onclick="resetEx(${i})">Reiniciar</button>
      <button class="btn" onclick="vid('${ex.yt}')">Veure vídeo</button></div>`;
    h+=`<input class="url" placeholder="Enganxa aquí l'enllaç d'una foto teva" value="${photo||''}" onchange="setPhoto('${id}',this.value)">`;
    h+=`</div>`;
  }
  return h+`</div>`;
}

 esc:{n:"Escalar",l:["Horitzontal: pendent a quatre grapes, passar sota troncs","Alçada d'esglaó: pujar i baixar d'una pedra de 30 cm","Travessar de costat un marge amb els peus a un pam","Amunt de veritat, quan ell ho demani"]},

function setDone(i,sets,d){
  const en=entry(curKey()); en.ex[i]=Math.min(sets,(en.ex[i]||0)+1); save();
  beep(880,.12); buzz(40);
  if(en.ex[i]<sets) startRest(i,d); else { rest=null; }
  render();
}

function startRest(i,d){
  if(rest&&rest.t) clearInterval(rest.t);
  rest={i:i,left:d,tot:d,t:null}; lock();
  rest.t=setInterval(()=>{
    rest.left--;
    const n=document.getElementById('rn'),b=document.getElementById('rb');
    if(n) n.textContent=mmss(Math.max(0,rest.left));
    if(b) b.style.width=(100-rest.left/rest.tot*100)+'%';
    if(rest.left<=3&&rest.left>0) beep(660,.08,.15);
    if(rest.left<=0){ clearInterval(rest.t); rest=null; beep(1040,.3); buzz([80,60,80]); unlock(); render(); }
  },1000);
}

  const km=(p.r*p.w/60/8).toFixed(1);

  h+=`<div class="tip"><b>Objectiu</b> · Ara corres uns ${km} km per sessió. Els 3 km seguits són el bloc ${i3} (cap al març) i els 5 km el bloc ${i5} (cap a l'estiu). Amb 3 sortides per setmana i sense saltar-te blocs.</div>`;

  h+=howHtml(); h+=adviceHtml('r');
  h+=routineCard('cool','Estiraments després de córrer',CD[S.prof+'-r'],'7 minuts · la part que tothom es salta');

}
function toggleRun(){
  const p=plan();
  if(run&&run.t){ clearInterval(run.t); run.t=null; unlock(); render(); return; }
  if(!run) run=S.warm?{ph:'e',n:1,left:600,t:null}:{ph:'w',n:1,left:p.w,t:null};
  lock();
  run.t=setInterval(()=>{
    run.left--;
    if(run.left<=3&&run.left>0) beep(660,.09,.18);
    if(run.left<=0){
      if(run.ph==='e'){ run.ph='w'; run.left=p.w; beep(1040,.4); buzz([300]); }
      else if(run.ph==='w'){
        if(run.n>=p.r){ clearInterval(run.t); run=null; beep(1200,.5); buzz([100,80,100,80,200]); unlock(); render(); return; }
        if(!p.k){ run.n++; run.left=p.w; beep(1040,.4); buzz([300]); }
        else { run.ph='k'; run.left=p.k; beep(440,.4); buzz([200,100,200]); }
      } else { run.ph='w'; run.n++; run.left=p.w; beep(1040,.4); buzz([300]); }
    }
    const b=document.getElementById('rbig'),ph=document.getElementById('rph'),rd=document.getElementById('rrd');
    if(b){ b.textContent=mmss(Math.max(0,run.left)); b.className='rbig '+(run.ph==='w'?'run':'walk'); }
    if(ph) ph.textContent=run.ph==='w'?'Corrent':(run.ph==='e'?'Escalfament':'Caminant');
    if(rd) rd.textContent=run.ph==='e'?'Camina ràpid 10 minuts':`Tanda ${run.n} de ${p.r}`;
  },1000);
  render();
}
function stopRun(re){ if(run&&run.t)clearInterval(run.t); run=null; unlock(); if(re)render(); }

function viewLog(){
  const l=L(); let f=0,r=0,p=0,tot=0;
  for(const k in l){ if(!l[k].ok) continue; tot++; const t=l[k].type; if(t==='f')f++; else if(t==='r')r++; else p++; }
  let st=0; for(let i=0;i<400;i++){ const e=l[dkey(i)]; if(e&&e.ok) st++; else if(i>0) break; }
  let dur=0,facil=0,pain=0; for(const k in l){ if(l[k].how==='dur')dur++; if(l[k].how==='facil')facil++; if(l[k].morn==='dolor')pain++; }
  let h=`<div class="dh"><div class="dt">Registre</div><div class="ds">${P_().name} · setmana ${weekOfPlan()} del pla · bloc ${S.block[S.prof]}</div></div>
  <div class="stats"><div class="st"><div class="v">${tot}</div><div class="k">sessions</div></div>
  <div class="st"><div class="v">${st}</div><div class="k">ratxa dies</div></div>
  <div class="st"><div class="v">${f}</div><div class="k">força</div></div>
  <div class="st"><div class="v">${r+p}</div><div class="k">muntanya</div></div></div>`;
  if(S.prof==='nen') h+=`<div class="tip"><b>★ ${totalStars()} missions</b> completades des del principi.</div>`;
  else if(tot>0) h+=`<div class="tip"><b>Sensacions</b> · ${facil} fàcils, ${tot-facil-dur} bé, ${dur} dures.${dur>facil&&tot>4?' Hi ha més sessions dures que fàcils: el pla va massa de pressa per a tu ara mateix, repeteix bloc.':''}</div>`;
  h+=`<div class="sect">Últimes 4 setmanes</div><div class="grid">`;
  h+=DS.map(d=>`<div class="gc" style="background:none;border:none;color:var(--mute)">${d[1]}</div>`).join('');
  let cur=new Date().getDay(); cur=cur===0?6:cur-1;
  for(let w=3;w>=0;w--) for(let i=0;i<7;i++){
    const off=(w*7)+(cur-i); 
    if(off<0){ h+=`<div class="gc"></div>`; continue; }
    const e=l[dkey(off)];
    const cls=e&&e.ok?(e.type==='f'?'f':(e.type==='r'?'r':'p')):'';
    h+=`<div class="gc ${cls}"></div>`;
  }
  h+=`</div><div class="tip" style="margin-top:14px">Verd força, blau córrer, terra família. Marca les sessions el mateix dia: el registre es guarda per data.</div>`;
  return h;
}

function viewGuide(){
  const g=P_();
  let h=`<div class="dh"><div class="dt">Guia</div><div class="ds">${g.name}</div></div>`;
  h+=`<div class="sect">Objectiu</div><div class="tip">${g.goal}</div>`;
  h+=`<div class="sect">Per a tu</div>`+g.tips.map(t=>`<div class="tip">${t}</div>`).join('');
  if(S.prof!=='nen') h+=`<div class="sect">La panxa</div>
  <div class="tip">No es pot aprimar per zones: fer abdominals enforteix el múscul de sota, però no crema el greix que hi ha a sobre. El que baixa la panxa és el conjunt: moure's cada dia, menjar bé i dormir. La força i les sortides a la muntanya ja fan la seva feina.</div>`;
  if(S.prof==='ell') h+=`<div class="sect">El camí a la dominada</div>
  <div class="tip"><b>1. Activació escapular</b> penjat, fins que els 8 et surtin nets. <b>2. Rem invertit supí</b>, baixant la branca fins a tenir el cos gairebé horitzontal. <b>3. Negatives</b> de 5 segons, i quan en facis 5 seguides de 5 segons, allarga-les a 8. <b>4. Aguantar a dalt</b>, de 10 a 20 segons. Quan aguantis 20 segons i facis negatives de 8, la dominada sencera surt sola.</div>
  <div class="tip"><b>Pit superior</b> · Dos angles: press inclinat al talús i flexions amb els peus elevats. Tot el que fas en pla treballa el pit mig; el superior només respon a l'angle. Per això he tret les flexions normals del programa: ja les tires bé i no te'l treballaven.</div>`;
  if(S.prof==='ell') h+=`<div class="sect">Per guanyar múscul</div>
  <div class="tip"><b>L'estímul.</b> Les dues últimes repeticions de cada sèrie han de costar. Quan una pedra se't queda curta, busca'n una de més gran o fes el moviment més lent.</div>
  <div class="tip"><b>Proteïna.</b> Al voltant d'1,4 a 1,6 grams per quilo de pes al dia, repartits entre els àpats: ous, llegums, peix, iogurt, carn. Amb menjar normal n'hi ha prou.</div>
  <div class="tip"><b>Descans.</b> El múscul es construeix dormint, no entrenant. I el tabac hi rema en contra: redueix la recuperació i la síntesi de proteïna.</div>`;
  if(S.prof==='ella') h+=`<div class="sect">Pit i glutis, la veritat</div>
  <div class="tip"><b>El pit.</b> El teixit del pit no és múscul i cap exercici el fa pujar directament. El que sí canvia és el que hi ha a sota i al darrere: un pectoral treballat que li fa de base, i una esquena alta oberta que fa que el pit miri endavant en comptes d'avall. Per això el divendres comença obrint l'esquena sobre el tronc i segueix amb press inclinat i obertures.</div>
  <div class="tip"><b>Els glutis.</b> Aquí sí que és múscul i sí que puja. Però per aixecar-lo cal càrrega progressiva, no només repeticions: una pedra a l'empenta de maluc que costi a les dues últimes, i anar-la fent més grossa. Els kickbacks, els clams i les elevacions laterals donen la forma; l'empenta amb pedra dona el volum.</div>
  <div class="sect">Estil pilates</div>
  <div class="tip"><b>Control abans que pes.</b> Cada repetició lenta i conscient. Si has de fer força amb el coll o arquejar l'esquena per acabar la sèrie, para: aquesta repetició no compta.</div>
  <div class="tip"><b>Respiració.</b> Expira sempre a l'esforç, amb el melic cap endins i les costelles tancades. És el que activa el centre i protegeix les lumbars.</div>
  <div class="tip"><b>To sense volum.</b> Amb repeticions altes i poc pes es guanya densitat i fermesa, no mida. Els resultats es veuen abans a la postura que a la bàscula.</div>`;
  if(S.prof!=='nen'){
    const m=new Date().getMonth(), ph=[[8,"Setembre · octubre","Fer-se amic de l'hàbit: tècnica sense pes, tandes curtes, res de pressa."],[10,"Novembre · desembre","Allargar: pedra més grossa, sortida llarga el cap de setmana, primer Parpers per asfalt."],[0,"Gener · febrer","Terreny real: el trajecte a la feina en e-bike un dissabte, primer només l'anada."],[2,"Març","Assaig general: un dia entre setmana amb despertador, dutxa a la feina i tot."],[3,"Abril 2027","Dos dies a la feina en bici, mai seguits. I els 3 km corrent de camí."]];
    h+=`<div class="sect">El camí fins a l'abril</div>`+ph.map((x,i)=>{const on=(i<4&&m>=x[0]&&m<(ph[i+1]?ph[i+1][0]===0?12:ph[i+1][0]:12))||(i===4&&m===3); return `<div class="tip" ${on?'':'style="opacity:.6;border-left-color:var(--mute)"'}><b>${x[1]}</b> · ${x[2]}</div>`;}).join('');
  }
  if(S.prof!=='nen') h+=`<div class="sect">Escalfar i estirar</div>
  <div class="tip"><b>Abans: dinàmic.</b> Moviment, sang als músculs, articulacions lubricades. Sis minuts fan la diferència entre una sessió que et surt i una que et fa mal. Mai estiraments aguantant abans d'entrenar: treuen força i no prevenen res.</div>
  <div class="tip"><b>Després: estàtic.</b> 30 segons per posició, tensió còmoda, sense rebots, respirant. No és el que et fa més flexible a curt termini; és el que fa que demà puguis tornar a entrenar.</div>
  <div class="tip"><b>Els primers minuts després de córrer</b> no paris en sec: camina un minut. El cor i les cames baixen de revolucions junts i ${S.prof==='ell'?'el genoll no es queda fred de cop.':'les lumbars no es carreguen.'}</div>
  <div class="tip"><b>El diumenge</b> és el dia de mobilitat, 12 minuts. Sembla poca cosa i és el que fa que els altres sis dies no s'acumulin.</div>`;
  if(S.prof!=='nen') h+=`<div class="sect">Com progressar sense gimnàs</div>
  <div class="tip"><b>Tempo abans que pes.</b> ${S.prof==='ell'?'Tres segons baixant fan que una pedra de 8 kg treballi com una de 12. I deixa sempre dues repeticions al dipòsit: la fatiga extrema no construeix més múscul, només et roba la sessió següent.':'Quatre segons baixant i quatre pujant: el múscul treballa el doble sense afegir un gram de pes ni un gram de risc per a l\'esquena.'}</div>
  <div class="tip"><b>Variants, no només pedres.</b> Cada exercici té un esglaó més fàcil i un més difícil, a la seva fitxa. Quan una sèrie et surt fàcil dues sessions seguides, puja de variant. Si un dia no arribes, baixa'n sense complexos.</div>
  <div class="tip"><b>Descàrrega cada sis setmanes.</b> L'app la marca sola: una sèrie menys de tot. És quan el cos consolida. Saltar-se-la és la manera més ràpida d'estancar-se o lesionar-se.</div>
  <div class="tip"><b>Per què cada exercici.</b> A cada fitxa hi tens una línia que diu què fa per a tu. Si no saps per què fas una cosa, la fas malament o la deixes de fer.</div>`;
  h+=`<div class="sect">Com funciona</div>
  <div class="tip"><b>Blocs de 2 setmanes.</b> Cada bloc allarga una mica el que corres o afegeix una tanda. Puja de bloc amb el botó de dalt només quan el bloc actual et surti còmode dues vegades.</div>
  <div class="tip"><b>Dels 3 als 5 km.</b> Un cop corris 20 minuts seguits, la resta és allargar 5 minuts cada dos blocs. Aquí és on la majoria es lesiona per pujar massa de pressa: si una setmana et costa, repeteix el bloc en comptes de passar al següent. No hi ha cap presa.</div>
  <div class="tip"><b>Tres sortides per setmana.</b> És el que més accelera arribar als 3 km: amb dues es triga uns 6 mesos, amb tres uns 4. Corre en pla o pujada suau i camina totes les baixades.</div>
  <div class="tip"><b>Força i córrer alternats.</b> Mai força de cames el dia abans de córrer. El dia de descans és obligatori, no opcional.</div>
  <div class="tip"><b>Un telèfon o dos.</b> Cada telèfon guarda el seu propi registre. Amb un de sol pots gestionar-ho tot menys dues curses simultànies: per això, el més pràctic és que ella tingui el fitxer al seu mòbil i tu al teu, i el del nen el porti qui vagi amb ell.</div>
  <div class="tip"><b>Material.</b> Pedres de mida còmoda, un tronc caigut més baix que el genoll i una branca gruixuda per penjar-se. Pesa les pedres un cop i apunta-ho, o no sabràs si progresses.</div>`;
  if(S.prof==='nen') h+=`<div class="sect">Coordinació ull-mà</div>
  <div class="tip"><b>Objectes lents.</b> Una pilota va massa ràpida per a qui li costa calcular. Un mocador, un globus o una bombolla cauen a poc a poc i donen temps de reaccionar: així encerta, i encertant agafa confiança. Quan domini el mocador, ja passareu a la pilota.</div>
  <div class="tip"><b>Rodar abans que llançar.</b> Fer rodar coses per terra entre vosaltres és molt més fàcil que llançar-les per l'aire, i treballa igual la punteria.</div>
  <div class="tip"><b>Els dos costats.</b> El joc de tocar el genoll contrari sembla una tonteria i és dels millors que hi ha: fa treballar junts els dos costats del cos, que és el que sol fallar.</div>
  <div class="sect">La por</div>
  <div class="tip">La por a l'esport ve gairebé sempre de sentir-se el pitjor davant d'altres. Per això aquí no hi ha cronòmetre, ni comptar punts, ni comparar-lo amb ningú. Guanya confiança fent coses que li surten.</div>
  <div class="tip">Per l'escalada, el pendent a quatre grapes li dona la mateixa sensació d'aventura sense alçada. No l'obliguis a pujar res que li faci por: cada vegada que ho superi ell sol valdrà per deu vegades forçat.</div>
  <div class="warn">Si la dificultat de coordinació és notable en el dia a dia (cordar-se, retallar, vestir-se, xocar amb les coses), val la pena comentar-ho amb el pediatre. Hi ha teràpia de psicomotricitat que va molt bé i com abans es comença, millor.</div>`;
  h+=`<div class="sect">Quan parar</div>
  <div class="warn">Dolor que et fa canviar la manera de caminar o córrer, inflor a una articulació, o molèstia que segueix igual al matí durant més d'una setmana: para i consulta un fisioterapeuta.</div>
  <div class="warn">Dolor o opressió al pit, mareig, o quedar-te sense aire de manera desproporcionada: atura't immediatament i consulta un metge. Als 45 i tornant a l'esport, una revisió amb prova d'esforç abans de començar és la inversió més sensata.</div>`;
  h+=`<div class="sect">Dades</div>
  <div class="tip">El registre viu en aquest telèfon. Fes una còpia de tant en tant, i sobretot abans de canviar de mòbil o de navegador.</div>
  <div class="acts"><button class="btn pri" onclick="exportData()">Descarregar còpia</button><button class="btn" onclick="importData()">Restaurar còpia</button><button class="btn" onclick="if(confirm('Esborrar tot el registre d\\'aquest perfil?')){S.log[S.prof]={};save();render();}">Esborrar registre</button></div>`;
  return h;
}

function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='define-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove();
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.log) throw 0; if(confirm('Substituir les dades actuals per la còpia?')){ S=Object.assign(S,d); save(); render(); } }catch(e){ alert('El fitxer no és una còpia vàlida.'); } };
    r.readAsText(f); };
  inp.click();
}
render();
</script>
